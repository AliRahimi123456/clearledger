# Stage 8 — AWS CI (ECR + OIDC)
# Same security gates as ci.yaml; registry and GitOps target differ.
#
# Gates: Gitleaks → Semgrep + Checkov → Build → Scan → Publish → Git (kustomization) → optional DAST
# Runs on GitHub-hosted runners (OIDC to AWS — no self-hosted runner required).
#
# Triggers on push/PR when GitHub repo variable CLEARLEDGER_CI_TARGET=aws (Stage 8).
# Also available via workflow_dispatch. Uses ubuntu-latest — no self-hosted runner.
#
# Setup:
#   GitHub Variables: CLEARLEDGER_CI_TARGET=aws, AWS_ACCOUNT_ID, AWS_REGION=eu-west-1
#   GitHub production environment secret: AWS_ACTIONS_ROLE_ARN
#     (= terraform output github_actions_ecr_role_arn)

name: CI — AWS (ECR + OIDC)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}
  KUSTOMIZE_DIR: stages/stage-8-aws-migration/manifests
  DOCKER_BUILDKIT: "1"

jobs:
  secrets-scan:
    name: "Secrets Scan (Gitleaks)"
    if: github.event_name == 'workflow_dispatch' || vars.CLEARLEDGER_CI_TARGET == 'aws'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          semgrep \
            --config=p/python \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --error \
            app/auth-service/ app/ledger-service/ app/notification-service/

  iac-scan:
    name: "IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        run: |
          pip install --user checkov
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          checkov --directory infra/manifests --framework kubernetes --soft-fail
          checkov --directory stages/stage-8-aws-migration/terraform --framework terraform --soft-fail
          checkov --directory . --framework dockerfile \
            --skip-path app/frontend/Dockerfile.dev \
            --hard-fail-on HIGH,CRITICAL

  # Build locally — nothing hits ECR until scan passes (artifact carries images between jobs).
  build-images:
    name: "Build images"
    runs-on: ubuntu-latest
    needs: [sast, iac-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build all services
        run: |
          docker build -t clearledger-auth-service:${IMAGE_TAG} ./app/auth-service
          docker build -t clearledger-ledger-service:${IMAGE_TAG} ./app/ledger-service
          docker build -t clearledger-notification-service:${IMAGE_TAG} ./app/notification-service
          docker build --no-cache -t clearledger-frontend:${IMAGE_TAG} ./app/frontend
          docker save -o images.tar \
            clearledger-auth-service:${IMAGE_TAG} \
            clearledger-ledger-service:${IMAGE_TAG} \
            clearledger-notification-service:${IMAGE_TAG} \
            clearledger-frontend:${IMAGE_TAG}
      - name: Upload built images
        uses: actions/upload-artifact@v4
        with:
          name: built-images
          path: images.tar
          retention-days: 1

  scan-images:
    name: "Scan images"
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4
      - name: Load built images
        uses: actions/download-artifact@v4
        with:
          name: built-images
      - name: Trivy scan all images (HIGH/CRITICAL)
        run: |
          docker load -i images.tar
          for img in \
            clearledger-auth-service:${IMAGE_TAG} \
            clearledger-ledger-service:${IMAGE_TAG} \
            clearledger-notification-service:${IMAGE_TAG} \
            clearledger-frontend:${IMAGE_TAG}; do
            echo "→ Trivy: ${img}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --exit-code 1 \
              --severity CRITICAL,HIGH --ignore-unfixed "${img}"
          done

  publish-images:
    name: "Publish images → ECR"
    runs-on: ubuntu-latest
    needs: [scan-images]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Load built images
        uses: actions/download-artifact@v4
        with:
          name: built-images
      - uses: sigstore/cosign-installer@v3.6.0
      - name: Push and sign all images
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          docker load -i images.tar
          chmod +x scripts/ci-publish-image.sh
          bash scripts/ci-publish-image.sh \
            "clearledger-auth-service:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/clearledger/auth-service:${IMAGE_TAG}" \
            ""
          bash scripts/ci-publish-image.sh \
            "clearledger-ledger-service:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/clearledger/ledger-service:${IMAGE_TAG}" \
            ""
          bash scripts/ci-publish-image.sh \
            "clearledger-notification-service:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/clearledger/notification-service:${IMAGE_TAG}" \
            ""
          bash scripts/ci-publish-image.sh \
            "clearledger-frontend:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/clearledger/frontend:${IMAGE_TAG}" \
            ""

  update-manifests:
    name: "Update GitOps manifests (kustomization.yaml)"
    runs-on: ubuntu-latest
    needs: [publish-images]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set ECR image tags in kustomization
        env:
          ECR: ${{ env.ECR_REGISTRY }}
          SHA: ${{ env.IMAGE_TAG }}
        run: |
          cd "${{ env.KUSTOMIZE_DIR }}"
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("kustomization.yaml")
          lines = p.read_text().splitlines()
          out = []
          i = 0
          ecr = __import__("os").environ["ECR"]
          sha = __import__("os").environ["SHA"]
          while i < len(lines):
              line = lines[i]
              out.append(line)
              if line.strip().startswith("- name: clearledger/"):
                  svc = line.split("clearledger/")[1].strip()
                  i += 1
                  while i < len(lines) and not lines[i].strip().startswith("- name:"):
                      if lines[i].strip().startswith("newName:"):
                          out.append(f"    newName: {ecr}/clearledger/{svc}")
                      elif lines[i].strip().startswith("newTag:"):
                          out.append(f"    newTag: {sha}")
                      else:
                          out.append(lines[i])
                      i += 1
                  continue
              i += 1
          p.write_text("\n".join(out) + "\n")
          PY
      - name: Commit and push (ArgoCD syncs clearledger-aws app)
        run: |
          git config user.email "github-ci@clearledger.local"
          git config user.name "GitHub Actions Bot"
          git add "${{ env.KUSTOMIZE_DIR }}/kustomization.yaml"
          if git diff --staged --quiet; then
            echo "No manifest changes"
          else
            git commit -m "ci(aws): deploy ${{ env.IMAGE_TAG }} to ECR [skip ci]"
            git push
          fi

  dast:
    name: "DAST (optional — AWS ALB URL)"
    runs-on: ubuntu-latest
    needs: [update-manifests]
    if: vars.AWS_DAST_BASE_URL != ''
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Wait for ArgoCD rollout
        run: sleep 90
      - name: Smoke test auth health
        run: |
          curl -fsS "${{ vars.AWS_DAST_BASE_URL }}/auth/health"
