# Stage 8 — AWS CI (ECR + OIDC)
# Same security gates as ci.yaml; registry and GitOps target differ.
#
# Gates: Gitleaks → Semgrep + Checkov → Detect changes → Build → Scan → Publish → GitOps → DAST
#
# Smart rebuild: only services whose source directory changed are built, scanned, and pushed.
# A workflow_dispatch always builds all services (force-rebuild).
#
# Triggers on push/PR when GitHub repo variable CLEARLEDGER_CI_TARGET=aws (Stage 8).
# Also available via workflow_dispatch. Uses ubuntu-latest — no self-hosted runner.
#
# Setup:
#   GitHub Variables: CLEARLEDGER_CI_TARGET=aws, AWS_ACCOUNT_ID, AWS_REGION=eu-west-1
#   GitHub production environment secret: AWS_ACTIONS_ROLE_ARN
#     (= terraform output github_actions_ecr_role_arn)

name: CI — AWS (ECR + OIDC)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force rebuild all services (ignore path filters)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  id-token: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}
  KUSTOMIZE_DIR: stages/stage-8-aws-migration/manifests
  DOCKER_BUILDKIT: "1"

jobs:
  # ── Security gate: always runs ──────────────────────────────────────────────
  secrets-scan:
    name: "Secrets Scan (Gitleaks)"
    if: github.event_name == 'workflow_dispatch' || vars.CLEARLEDGER_CI_TARGET == 'aws'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          semgrep \
            --config=p/python \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --error \
            app/auth-service/ app/ledger-service/ app/notification-service/

  iac-scan:
    name: "IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        run: |
          pip install --user checkov
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          checkov --directory infra/manifests --framework kubernetes --soft-fail
          checkov --directory stages/stage-8-aws-migration/terraform --framework terraform --soft-fail
          checkov --directory . --framework dockerfile \
            --skip-path app/frontend/Dockerfile.dev \
            --hard-fail-on HIGH,CRITICAL

  # ── Detect which service directories changed ─────────────────────────────────
  detect-changes:
    name: "Detect changed services"
    runs-on: ubuntu-latest
    needs: secrets-scan
    outputs:
      auth:         ${{ steps.filter.outputs.auth }}
      ledger:       ${{ steps.filter.outputs.ledger }}
      notification: ${{ steps.filter.outputs.notification }}
      frontend:     ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'app/auth-service/**'
            ledger:
              - 'app/ledger-service/**'
            notification:
              - 'app/notification-service/**'
            frontend:
              - 'app/frontend/**'

  # ── Build only what changed (or everything on workflow_dispatch force_all) ───
  build-images:
    name: "Build changed images"
    runs-on: ubuntu-latest
    needs: [sast, iac-scan, detect-changes]
    # Skip entirely if nothing service-related changed
    if: |
      github.event.inputs.force_all == 'true' ||
      needs.detect-changes.outputs.auth         == 'true' ||
      needs.detect-changes.outputs.ledger        == 'true' ||
      needs.detect-changes.outputs.notification  == 'true' ||
      needs.detect-changes.outputs.frontend      == 'true'
    env:
      FORCE: ${{ github.event.inputs.force_all == 'true' }}
      BUILD_AUTH:         ${{ needs.detect-changes.outputs.auth }}
      BUILD_LEDGER:       ${{ needs.detect-changes.outputs.ledger }}
      BUILD_NOTIFICATION: ${{ needs.detect-changes.outputs.notification }}
      BUILD_FRONTEND:     ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - name: Build changed services
        run: |
          IMAGES=""
          build() { local svc=$1 dir=$2
            docker build -t "clearledger-${svc}:${IMAGE_TAG}" "./${dir}"
            IMAGES="${IMAGES} clearledger-${svc}:${IMAGE_TAG}"
          }
          [ "$FORCE" = "true" ] || [ "$BUILD_AUTH"         = "true" ] && build auth-service         app/auth-service
          [ "$FORCE" = "true" ] || [ "$BUILD_LEDGER"       = "true" ] && build ledger-service       app/ledger-service
          [ "$FORCE" = "true" ] || [ "$BUILD_NOTIFICATION" = "true" ] && build notification-service app/notification-service
          [ "$FORCE" = "true" ] || [ "$BUILD_FRONTEND"     = "true" ] && build frontend             app/frontend
          docker save -o images.tar ${IMAGES}
      - name: Upload built images
        uses: actions/upload-artifact@v4
        with:
          name: built-images
          path: images.tar
          retention-days: 1

  scan-images:
    name: "Scan images (Trivy)"
    runs-on: ubuntu-latest
    needs: [build-images, detect-changes]
    env:
      FORCE: ${{ github.event.inputs.force_all == 'true' }}
      BUILD_AUTH:         ${{ needs.detect-changes.outputs.auth }}
      BUILD_LEDGER:       ${{ needs.detect-changes.outputs.ledger }}
      BUILD_NOTIFICATION: ${{ needs.detect-changes.outputs.notification }}
      BUILD_FRONTEND:     ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-images
      - name: Trivy scan changed images (HIGH/CRITICAL block)
        run: |
          docker load -i images.tar
          scan() { local img=$1
            echo "→ Trivy: ${img}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --exit-code 1 \
              --severity CRITICAL,HIGH --ignore-unfixed "${img}"
          }
          [ "$FORCE" = "true" ] || [ "$BUILD_AUTH"         = "true" ] && scan "clearledger-auth-service:${IMAGE_TAG}"
          [ "$FORCE" = "true" ] || [ "$BUILD_LEDGER"       = "true" ] && scan "clearledger-ledger-service:${IMAGE_TAG}"
          [ "$FORCE" = "true" ] || [ "$BUILD_NOTIFICATION" = "true" ] && scan "clearledger-notification-service:${IMAGE_TAG}"
          [ "$FORCE" = "true" ] || [ "$BUILD_FRONTEND"     = "true" ] && scan "clearledger-frontend:${IMAGE_TAG}"

  publish-images:
    name: "Publish images → ECR"
    runs-on: ubuntu-latest
    needs: [scan-images, detect-changes]
    environment: production
    env:
      FORCE: ${{ github.event.inputs.force_all == 'true' }}
      BUILD_AUTH:         ${{ needs.detect-changes.outputs.auth }}
      BUILD_LEDGER:       ${{ needs.detect-changes.outputs.ledger }}
      BUILD_NOTIFICATION: ${{ needs.detect-changes.outputs.notification }}
      BUILD_FRONTEND:     ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        with:
          name: built-images
      - uses: sigstore/cosign-installer@v3.6.0
      - name: Push and sign changed images
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          docker load -i images.tar
          chmod +x scripts/ci-publish-image.sh
          publish() { local local_tag=$1 ecr_tag=$2
            bash scripts/ci-publish-image.sh "${local_tag}" "${ecr_tag}" ""
          }
          [ "$FORCE" = "true" ] || [ "$BUILD_AUTH"         = "true" ] && publish "clearledger-auth-service:${IMAGE_TAG}"         "${ECR_REGISTRY}/clearledger/auth-service:${IMAGE_TAG}"
          [ "$FORCE" = "true" ] || [ "$BUILD_LEDGER"       = "true" ] && publish "clearledger-ledger-service:${IMAGE_TAG}"       "${ECR_REGISTRY}/clearledger/ledger-service:${IMAGE_TAG}"
          [ "$FORCE" = "true" ] || [ "$BUILD_NOTIFICATION" = "true" ] && publish "clearledger-notification-service:${IMAGE_TAG}" "${ECR_REGISTRY}/clearledger/notification-service:${IMAGE_TAG}"
          [ "$FORCE" = "true" ] || [ "$BUILD_FRONTEND"     = "true" ] && publish "clearledger-frontend:${IMAGE_TAG}"             "${ECR_REGISTRY}/clearledger/frontend:${IMAGE_TAG}"

  update-manifests:
    name: "Update GitOps manifests (kustomization.yaml)"
    runs-on: ubuntu-latest
    needs: [publish-images, detect-changes]
    environment: production
    env:
      FORCE: ${{ github.event.inputs.force_all == 'true' }}
      BUILD_AUTH:         ${{ needs.detect-changes.outputs.auth }}
      BUILD_LEDGER:       ${{ needs.detect-changes.outputs.ledger }}
      BUILD_NOTIFICATION: ${{ needs.detect-changes.outputs.notification }}
      BUILD_FRONTEND:     ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update only changed service tags in kustomization
        env:
          ECR: ${{ env.ECR_REGISTRY }}
          SHA: ${{ env.IMAGE_TAG }}
        run: |
          cd "${{ env.KUSTOMIZE_DIR }}"
          python3 << 'PY'
          import os, pathlib

          ecr   = os.environ["ECR"]
          sha   = os.environ["SHA"]
          force = os.environ.get("FORCE", "false") == "true"

          changed = set()
          if force or os.environ.get("BUILD_AUTH")         == "true": changed.add("auth-service")
          if force or os.environ.get("BUILD_LEDGER")       == "true": changed.add("ledger-service")
          if force or os.environ.get("BUILD_NOTIFICATION") == "true": changed.add("notification-service")
          if force or os.environ.get("BUILD_FRONTEND")     == "true": changed.add("frontend")

          p = pathlib.Path("kustomization.yaml")
          lines = p.read_text().splitlines()
          out, i = [], 0
          while i < len(lines):
              line = lines[i]
              out.append(line)
              if line.strip().startswith("- name: clearledger/"):
                  svc = line.split("clearledger/")[1].strip()
                  i += 1
                  while i < len(lines) and not lines[i].strip().startswith("- name:"):
                      if svc in changed:
                          if lines[i].strip().startswith("newName:"):
                              out.append(f"    newName: {ecr}/clearledger/{svc}")
                          elif lines[i].strip().startswith("newTag:"):
                              out.append(f"    newTag: {sha}")
                          else:
                              out.append(lines[i])
                      else:
                          out.append(lines[i])  # keep existing tag for unchanged services
                      i += 1
                  continue
              i += 1
          p.write_text("\n".join(out) + "\n")
          PY
      - name: Commit and push (ArgoCD syncs clearledger-aws app)
        run: |
          git config user.email "github-ci@clearledger.local"
          git config user.name "GitHub Actions Bot"
          git add "${{ env.KUSTOMIZE_DIR }}/kustomization.yaml"
          if git diff --staged --quiet; then
            echo "No manifest changes"
          else
            git commit -m "ci(aws): deploy ${{ env.IMAGE_TAG }} to ECR [skip ci]"
            git push
          fi

  dast:
    name: "DAST (optional — AWS ALB URL)"
    runs-on: ubuntu-latest
    needs: [update-manifests]
    if: vars.AWS_DAST_BASE_URL != ''
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Wait for ArgoCD rollout
        run: sleep 90
      - name: Smoke test health endpoints
        run: |
          curl -fsS "${{ vars.AWS_DAST_BASE_URL }}/auth/health"
          curl -fsS "${{ vars.AWS_DAST_BASE_URL }}/ledger/health"
          curl -fsS "${{ vars.AWS_DAST_BASE_URL }}/notifications/health"
