name: ClearLedger DevSecOps Pipeline (GitHub)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Compliance scans (kube-bench) run weekly, not per commit.
    - cron: "0 6 * * 1"  # every Monday 6am

# Cancels redundant runs — only the latest push matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io/${{ secrets.DOCKER_USERNAME }}
  # Why IMAGE_TAG: immutable traceability (each image maps to one commit).
  IMAGE_TAG: ${{ github.sha }}
  TRIVY_VERSION: "0.70.0"
  # BuildKit pip cache + one DB refresh per workflow (not per service).
  DOCKER_BUILDKIT: "1"
  TRIVY_TIMEOUT: 15m
  GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 336h

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # GATE 1: SECRETS SCAN!
  # Catch hardcoded secrets before anything else runs.
  # A leaked secret is a breach. Stop everything if one is found.
  # ───────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: "Secrets Scan (Gitleaks)"
    # Self-hosted runner — GitHub cloud runners cannot reach
    # clearledger.local or the local MicroK8s cluster.
    runs-on: [self-hosted, clearledger]
    # Weekly scheduled runs are reserved for compliance scanning (kube-bench).
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout code (full history for secrets scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — scan every commit, not just HEAD

      - name: Install Gitleaks (secrets detection engine)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (fail if any secret found)
        run: |
          gitleaks detect \
            --source . \
            --verbose \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Upload Gitleaks report (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 2: SAST
  # Static analysis — find security issues in Python code.
  # Runs in parallel with IaC scan — both require secrets-scan to pass.
  # ───────────────────────────────────────────────────────────────────────────
  sast:
    name: "SAST (Semgrep)"
    # Self-hosted runner — GitHub cloud runners cannot reach
    # clearledger.local or the local MicroK8s cluster.
    runs-on: [self-hosted, clearledger]
    needs: secrets-scan
    steps:
      - name: Checkout code (SAST runs on source)
        uses: actions/checkout@v4

      - name: Install Semgrep (OWASP-focused rulesets)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep (fail on findings)
        run: |
          semgrep \
            --config=p/python \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --error \
            --json \
            --output semgrep-results.json \
            app/auth-service/ app/ledger-service/ app/notification-service/

      - name: Upload Semgrep results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 3: IaC SCAN
  # Checkov scans Kubernetes manifests and Dockerfiles for misconfigurations.
  # ───────────────────────────────────────────────────────────────────────────
  iac-scan:
    name: "IaC Scan (Checkov)"
    # Self-hosted runner — GitHub cloud runners cannot reach
    # clearledger.local or the local MicroK8s cluster.
    runs-on: [self-hosted, clearledger]
    needs: secrets-scan
    steps:
      - name: Checkout code (IaC lives in infra/)
        uses: actions/checkout@v4

      - name: Install Checkov (policy-as-code for IaC)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user checkov
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan Kubernetes manifests (evidence only in Stage 1)
        run: |
          checkov \
            --directory infra/manifests \
            --framework kubernetes \
            --output json \
            --output-file checkov-k8s-results.json \
            --soft-fail

      - name: Scan Dockerfiles (block HIGH/CRITICAL)
        run: |
          checkov \
            --directory . \
            --framework dockerfile \
            --skip-path app/frontend/Dockerfile.dev \
            --output json \
            --output-file checkov-dockerfile-results.json \
            --soft-fail-on MEDIUM \
            --hard-fail-on HIGH,CRITICAL

      - name: Upload Checkov results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: "checkov-*-results.json"

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 3b: PREPARE SCANNERS (once per workflow)
  # Single Trivy/Grype DB download — scan jobs reuse cache via --skip-db-update.
  # Prod pattern: separate infra prep from per-artifact scan gates.
  # ───────────────────────────────────────────────────────────────────────────
  prepare-scanners:
    name: "Prepare scanners (Trivy + Grype DB)"
    runs-on: [self-hosted, clearledger]
    needs: [sast, iac-scan]
    if: github.event_name != 'schedule'
    steps:
      - name: Install scanner CLIs (once per runner)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v trivy &>/dev/null; then
            curl -sSfL \
              "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              | tar -xzC "$HOME/.local/bin" trivy
          fi
          if ! command -v syft &>/dev/null; then
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
              | sh -s -- -b "$HOME/.local/bin"
          fi
          if ! command -v grype &>/dev/null; then
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
              | sh -s -- -b "$HOME/.local/bin"
          fi
          if ! command -v cosign &>/dev/null; then
            curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64 \
              -o "$HOME/.local/bin/cosign" && chmod +x "$HOME/.local/bin/cosign"
          fi
          trivy --version
          grype version

      - name: Refresh Trivy DB (once per workflow; Grype uses cache age on scan)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          trivy image --download-db-only
          echo "✓ Trivy DB ready"

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 4a: BUILD — local images only (nothing hits the registry yet)
  # Prod pattern: build produces artifacts; scan gates before publish.
  # ───────────────────────────────────────────────────────────────────────────
  build-images:
    name: "Build images"
    runs-on: [self-hosted, clearledger]
    needs: [prepare-scanners]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all services (sequential — one runner, shared pip cache)
        run: |
          docker build -t clearledger-auth-service:${IMAGE_TAG} ./app/auth-service
          docker build -t clearledger-ledger-service:${IMAGE_TAG} ./app/ledger-service
          docker build -t clearledger-notification-service:${IMAGE_TAG} ./app/notification-service
          # Frontend: no pip layer — force fresh apk upgrade for OS security patches
          docker build --no-cache -t clearledger-frontend:${IMAGE_TAG} ./app/frontend
          docker images | grep "${IMAGE_TAG}"

      - name: Network diagnostic (on build failure)
        if: failure()
        run: |
          host_dns=0; container_dns=0
          getent hosts registry-1.docker.io >/dev/null 2>&1 && host_dns=1
          docker run --rm alpine:3.20 getent hosts registry-1.docker.io >/dev/null 2>&1 && container_dns=1
          echo "host_dns=${host_dns} container_dns=${container_dns}"
          echo "1 0 = Docker bridge/NAT broken (investigate MicroK8s iptables); 0 0 = host resolver still broken."
          resolvectl status 2>/dev/null || true

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 4b: SCAN — block publish if CVEs found (images stay local)
  # ───────────────────────────────────────────────────────────────────────────
  scan-images:
    name: "Scan images"
    runs-on: [self-hosted, clearledger]
    needs: [build-images]
    steps:
      - name: Checkout code (.grype.yaml ignore rules)
        uses: actions/checkout@v4

      - name: Trivy scan all images (HIGH/CRITICAL)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for img in \
            clearledger-auth-service:${IMAGE_TAG} \
            clearledger-ledger-service:${IMAGE_TAG} \
            clearledger-notification-service:${IMAGE_TAG} \
            clearledger-frontend:${IMAGE_TAG}; do
            echo "→ Trivy: ${img}"
            extra=()
            if [[ "${img}" == clearledger-auth-service:* ]]; then
              extra=(--format json --output trivy-auth-results.json)
            fi
            trivy image --skip-db-update --exit-code 1 \
              --severity CRITICAL,HIGH --ignore-unfixed \
              "${extra[@]}" "${img}"
          done

      - name: Auth SBOM + Grype (fixable HIGH+ only on auth-service)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          syft clearledger-auth-service:${IMAGE_TAG} -o spdx-json=sbom-auth.json
          grype sbom:sbom-auth.json --fail-on high --only-fixed \
            --output json --file grype-auth-results.json

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-results
          path: |
            trivy-auth-results.json
            sbom-auth.json
            grype-auth-results.json

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 4c: PUBLISH — registry push + Cosign (only after scan passes)
  # ───────────────────────────────────────────────────────────────────────────
  publish-images:
    name: "Publish images"
    runs-on: [self-hosted, clearledger]
    needs: [scan-images]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push and sign all images
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          chmod +x scripts/ci-publish-image.sh
          bash scripts/ci-publish-image.sh \
            "clearledger-auth-service:${IMAGE_TAG}" \
            "${REGISTRY}/clearledger-auth-service:${IMAGE_TAG}" \
            "${REGISTRY}/clearledger-auth-service"
          bash scripts/ci-publish-image.sh \
            "clearledger-ledger-service:${IMAGE_TAG}" \
            "${REGISTRY}/clearledger-ledger-service:${IMAGE_TAG}" \
            "${REGISTRY}/clearledger-ledger-service"
          bash scripts/ci-publish-image.sh \
            "clearledger-notification-service:${IMAGE_TAG}" \
            "${REGISTRY}/clearledger-notification-service:${IMAGE_TAG}" \
            "${REGISTRY}/clearledger-notification-service"
          bash scripts/ci-publish-image.sh \
            "clearledger-frontend:${IMAGE_TAG}" \
            "${REGISTRY}/clearledger-frontend:${IMAGE_TAG}" \
            ""

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 5: UPDATE MANIFESTS
  # All gates passed. All images scanned and signed.
  # Stage 1: commit new tags to clearledger-infra only (no kubectl).
  # Stage 2+: optional ArgoCD refresh when ENABLE_ARGOCD_SYNC=true.
  # ───────────────────────────────────────────────────────────────────────────
  update-manifests:
    name: "Update Manifests → GitHub"
    # Self-hosted runner — GitHub cloud runners cannot reach
    # clearledger.local or the local MicroK8s cluster.
    runs-on: [self-hosted, clearledger]
    needs: [publish-images]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout app repo (canonical manifests)
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout infra repo (GitOps target)
        uses: actions/checkout@v4
        with:
          # clearledger-infra is a separate GitHub repo — the GitOps source of truth.
          # INFRA_REPO_TOKEN: a GitHub PAT with repo scope.
          repository: ${{ github.repository_owner }}/clearledger-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Sync manifests + set image tags (Kustomize)
        run: |
          set -euo pipefail
          if ! command -v kustomize &>/dev/null; then
            curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
              | tar xz && sudo mv kustomize /usr/local/bin/
          fi
          # Copy full canonical tree — prevents probe/limit drift (prod: single source)
          # App secrets stay in GitOps until Stage 5 (learner deletes them from both repos).
          rsync -a --delete \
            app/infra/manifests/ infra/manifests/
          cd infra/manifests
          kustomize edit set image \
            clearledger/auth-service=${REGISTRY}/clearledger-auth-service:${{ github.sha }} \
            clearledger/ledger-service=${REGISTRY}/clearledger-ledger-service:${{ github.sha }} \
            clearledger/notification-service=${REGISTRY}/clearledger-notification-service:${{ github.sha }} \
            clearledger/frontend=${REGISTRY}/clearledger-frontend:${{ github.sha }}
          kustomize build . >/dev/null
          echo "✓ kustomize build OK"

      - name: Commit and push
        run: |
          cd infra
          git config user.email "github-ci@clearledger.local"
          git config user.name "GitHub Actions Bot"
          git add manifests/
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "ci: deploy ${{ github.sha }} — all gates passed [skip ci]"
            git push
          fi

      # Stage 2+ only — off by default so Stage 1 learners see the deployment gap
      # (infra repo updates; cluster unchanged). Enable: repo variable ENABLE_ARGOCD_SYNC=true
      # Nudge only: manifest push above already succeeded; ArgoCD polls clearledger-infra anyway.
      - name: Trigger ArgoCD refresh (Stage 2+ — requires ENABLE_ARGOCD_SYNC)
        if: vars.ENABLE_ARGOCD_SYNC == 'true'
        continue-on-error: true
        run: |
          warn() {
            echo "⚠ ArgoCD nudge skipped ($1). Manifests are already pushed to clearledger-infra — ArgoCD will sync on its next poll (~3 min). This is not a failure."
          }
          if ! command -v microk8s &>/dev/null; then
            warn "microk8s not found"
            exit 0
          fi
          if ! microk8s kubectl cluster-info &>/dev/null; then
            warn "cluster unreachable"
            exit 0
          fi
          if microk8s kubectl apply -f app/infra/argocd/clearledger-app.yaml && \
             microk8s kubectl annotate application clearledger -n argocd \
               argocd.argoproj.io/refresh=hard --overwrite; then
            echo "✓ ArgoCD nudge sent — sync should start immediately"
          else
            warn "kubectl apply/annotate failed"
          fi
          exit 0

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 6: DAST (post-deploy)
  # DAST needs a live running application. It cannot run against source code.
  # This is why it's the final gate — it validates the deployed artifact,
  # not the build artifact. Runs only on main branch pushes (not PRs): the
  # runner must reach the live ingress (often requires self-hosted runner).
  # ───────────────────────────────────────────────────────────────────────────
  dast:
    name: "DAST (OWASP ZAP + fintech API tests)"
    # Self-hosted runner — GitHub cloud runners cannot reach
    # clearledger.local or the local MicroK8s cluster.
    runs-on: [self-hosted, clearledger]
    needs: [update-manifests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DAST == 'true'
    steps:
      - name: Checkout app repo (DAST config + custom tests live here)
        uses: actions/checkout@v4

      - name: Wait for ArgoCD sync (tests deployed artifact)
        run: sleep 60

      - name: Install Python deps (requests only)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user requests

      - name: Register ZAP user, login, inject JWT into ZAP plan
        env:
          DAST_BASE_URL: http://clearledger.local
        run: |
          set -euo pipefail
          ZAP_EMAIL="zap-dast@clearledger.local"
          ZAP_PASS="ZapDastPass123!"
          curl -fsS -X POST "${DAST_BASE_URL}/auth/register" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${ZAP_EMAIL}\",\"password\":\"${ZAP_PASS}\"}" \
            || true
          TOKEN=$(curl -fsS -X POST "${DAST_BASE_URL}/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${ZAP_EMAIL}\",\"password\":\"${ZAP_PASS}\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          CFG=stages/stage-3-security-gates/dast/zap-config.yaml
          sed -i.bak "s|ZAP_ACCESS_TOKEN_PLACEHOLDER|${TOKEN}|g" "$CFG"

      - name: Run OWASP ZAP automation plan (API scan)
        run: |
          set -euo pipefail
          DAST_DIR="${{ github.workspace }}/stages/stage-3-security-gates/dast"
          docker run --rm \
            -v "${DAST_DIR}:/zap/wrk:rw" \
            zaproxy/zap-stable \
            zap.sh -cmd -autorun /zap/wrk/zap-config.yaml
          test -f "${DAST_DIR}/zap-report.json"

      - name: Fail on ZAP HIGH or CRITICAL findings
        run: |
          set -euo pipefail
          RPT=stages/stage-3-security-gates/dast/zap-report.json
          n=$(jq '[.site[]? | .alerts[]? | select(.risk=="High" or .risk=="Critical")] | length' "$RPT")
          echo "ZAP High+ alert count: $n"
          test "$n" -eq 0

      - name: Run fintech DAST payloads (BOLA/JWT/business logic)
        env:
          BASE_URL: http://clearledger.local
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          python3 stages/stage-3-security-gates/dast/fintech-test-payloads.py 2>&1 | tee fintech-dast-output.txt

      - name: Upload DAST artifacts (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: |
            stages/stage-3-security-gates/dast/zap-report.json
            fintech-dast-output.txt
