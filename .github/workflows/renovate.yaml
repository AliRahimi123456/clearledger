# Renovate Bot runs weekly and when manually triggered.
# It watches requirements.txt, Dockerfiles, Terraform files,
# and Kubernetes manifests for available updates.
#
# When a CVE is found in a pinned dependency, Renovate raises a
# PR immediately (schedule: "at any time") so the team knows
# before the next scheduled pipeline run.
#
# To run manually: GitHub → Actions → Renovate → Run workflow
#
# Setup: Add RENOVATE_TOKEN secret (GitHub PAT with repo scope)
# at: github.com/YOUR_USERNAME/clearledger/settings/secrets/actions
#
# automerge is intentionally disabled — dependency updates can introduce
# breaking changes even at patch level; human review is the control.
name: Renovate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    name: "Renovate dependency updates"
    # Self-hosted runner — GitHub cloud runners cannot reach
    # clearledger.local or the local MicroK8s cluster.
    runs-on: [self-hosted, clearledger]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v40
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@clearledger.local>"
          RENOVATE_VULNERABILITY_ALERTS: "true"
