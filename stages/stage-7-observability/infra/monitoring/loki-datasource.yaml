# Grafana sidecar datasource (label grafana_datasource=1 from kube-prometheus-stack-values).
# Ensures Loki proxy timeouts and concurrency caps even when Helm datasource CM is stale.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clearledger-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  clearledger-loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 500
          timeout: 60
          maxConcurrent: 6
          manageAlerts: false
