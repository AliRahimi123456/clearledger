# PURPOSE: Least-privilege RBAC — CIS K8s 5.1 / SOC2 CC6.3
# FRAMEWORK: CIS Kubernetes Benchmark 5.1.5, 5.1.6
# RBAC is allow-only — this ClusterRole grants zero verbs. Namespace RoleBinding ties
# the clearledger/default SA to it so audits see an explicit attachment; pair with
# Kyverno or policy if you need hard rejection of Secret API calls from default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clearledger-deny-secrets
rules: []
---
