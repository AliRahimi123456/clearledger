# INTRODUCED: Stage 0 (foundational) — added retroactively to existing stages
# PURPOSE: Least-privilege RBAC — CIS K8s 5.1 / SOC2 CC6.3
# FRAMEWORK: CIS Kubernetes Benchmark 5.1.5, 5.1.6
#
# Workload ServiceAccounts: endpoints only (service DNS uses Endpoints objects).
# No Secret API access — Stage 0 mounts Secrets via secretKeyRef (kubelet); Stage 5 uses Vault files.
# clearledger-viewer: read-only platform SA — never Secrets.
# clearledger-deny-secrets ClusterRole: rules: [] — RBAC cannot "deny"; binding documents
#   intent that default SA receives no extra permissions from this role. Do not grant Secret
#   verbs to default elsewhere. For hard deny on Secret API use admission (e.g. Kyverno).

