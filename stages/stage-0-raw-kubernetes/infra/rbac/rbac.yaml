# INTRODUCED: Stage 0 (foundational) — added retroactively to existing stages
# PURPOSE: Least-privilege RBAC — CIS K8s 5.1 / SOC2 CC6.3
# FRAMEWORK: CIS Kubernetes Benchmark 5.1.5, 5.1.6
# Platform read-only: inspect workloads without Secret material via API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clearledger-viewer
  namespace: clearledger
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
