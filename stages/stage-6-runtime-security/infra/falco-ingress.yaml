# INTRODUCED: Stage 6 — Runtime Security (Falco)
# PURPOSE: Expose Falcosidekick UI at http://falco.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: falco-ingress
  namespace: falco
spec:
  ingressClassName: nginx
  rules:
    - host: falco.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: falco-falcosidekick-ui
                port:
                  number: 2802
