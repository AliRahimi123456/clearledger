# Same as infra/argocd/clearledger-app.yaml
# Included here so Stage 2 is self-contained
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clearledger
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Osomudeya/clearledger-infra.git
    targetRevision: main
    path: manifests
    directory:
      recurse: true   # required — deployments live in manifests/*/
  destination:
    server: https://kubernetes.default.svc
    namespace: clearledger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
