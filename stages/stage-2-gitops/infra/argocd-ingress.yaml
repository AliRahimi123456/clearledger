# INTRODUCED: Stage 2 — GitOps with ArgoCD
# PURPOSE: Expose ArgoCD UI at https://argocd.local
# NOTE: CLI via this ingress requires --grpc-web on argocd login and other CLI calls
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Homelab: HTTP login loops (session cookie mismatch) — force HTTPS in the browser
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
