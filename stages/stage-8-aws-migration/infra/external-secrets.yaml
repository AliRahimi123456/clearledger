# Stage 8 — AWS Migration
# PURPOSE: Pull secrets from AWS Secrets Manager into Kubernetes Secrets
#          via External Secrets Operator (ESO).
#          ESO replaces the Vault agent sidecar in the AWS deployment.
#          The application code does not change — it still reads env vars
#          that point at K8s Secrets.
#
# PREREQUISITES:
#   1. External Secrets Operator installed:
#      helm install external-secrets external-secrets/external-secrets \
#        -n external-secrets --create-namespace
#   2. IRSA configured — ESO service account has AWS Secrets Manager read permissions
#   3. Secrets created in AWS Secrets Manager (see Stage 8 README)

# ── ClusterSecretStore ────────────────────────────────────────────────────────
# Tells ESO where to find secrets (AWS Secrets Manager, eu-west-1)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# ── ExternalSecret: auth-service ─────────────────────────────────────────────
# Pulls clearledger/auth-service from AWS Secrets Manager.
# Creates a K8s Secret named auth-service-secret in the clearledger namespace.
# Refreshes every hour — secret rotation is automatic.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secret
  namespace: clearledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-service-secret
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: clearledger/auth-service
        property: database_url
    - secretKey: jwt_secret
      remoteRef:
        key: clearledger/auth-service
        property: jwt_secret
---
# ── ExternalSecret: ledger-service ───────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ledger-service-secret
  namespace: clearledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ledger-service-secret
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: clearledger/ledger-service
        property: database_url
