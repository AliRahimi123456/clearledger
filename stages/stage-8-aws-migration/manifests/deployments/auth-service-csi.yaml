# Stage 8 — auth-service using Secrets Store CSI (file mounts, same code path as Vault)
# Swap into kustomization.yaml for §8.5 CSI exercise (replace deployments/auth-service.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: clearledger
  labels:
    app: auth-service
    version: v0.1.0
    secrets: csi
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: v0.1.0
        secrets: csi
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: clearledger-auth-service-spc
      containers:
        - name: auth-service
          image: clearledger/auth-service:bootstrap
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL_FILE
              value: /mnt/secrets/database_url
            - name: JWT_SECRET_FILE
              value: /mnt/secrets/jwt_secret
            - name: SERVICE_NAME
              value: "auth-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace=clearledger,k8s.deployment.name=auth-service"
            - name: ENV
              value: "production"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
