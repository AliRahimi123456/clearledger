# INTRODUCED: Stage 8 — AWS Migration (IRSA)
# PURPOSE: Bind ClearLedger workload ServiceAccounts to pod-scoped IAM roles on EKS.
#
# Before kubectl apply:
#   cd stages/stage-8-aws-migration/terraform
#   export REPLACE_AUTH_IRSA_ROLE_ARN=$(terraform output -raw auth_service_irsa_role_arn)
#   export REPLACE_LEDGER_IRSA_ROLE_ARN=$(terraform output -raw ledger_service_irsa_role_arn)
#   export REPLACE_NOTIFICATION_IRSA_ROLE_ARN=$(terraform output -raw notification_service_irsa_role_arn)
#   envsubst < clearledger-serviceaccounts.yaml | kubectl apply -f -
#
# eks.amazonaws.com/token-expiration: seconds for projected token lifetime on the node.
# Shorter = smaller theft window. Default AWS is 86400 (24h); 3600 (1h) is a
# reasonable fintech lab default — tune with your SRE rotation story.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: clearledger
  annotations:
    eks.amazonaws.com/role-arn: "${REPLACE_AUTH_IRSA_ROLE_ARN}"
    eks.amazonaws.com/token-expiration: "3600"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-service
  namespace: clearledger
  annotations:
    eks.amazonaws.com/role-arn: "${REPLACE_LEDGER_IRSA_ROLE_ARN}"
    eks.amazonaws.com/token-expiration: "3600"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: clearledger
  annotations:
    eks.amazonaws.com/role-arn: "${REPLACE_NOTIFICATION_IRSA_ROLE_ARN}"
    eks.amazonaws.com/token-expiration: "3600"
