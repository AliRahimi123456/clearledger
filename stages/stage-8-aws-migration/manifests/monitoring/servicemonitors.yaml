---
# ServiceMonitor: tells Prometheus (kube-prometheus-stack) to scrape ClearLedger services.
# The kube-prometheus-stack chart selects ServiceMonitors with no namespace restriction
# by default when serviceMonitorSelectorNilUsesHelmValues=false (our AWS values set this).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clearledger-auth
  namespace: clearledger
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: auth-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clearledger-ledger
  namespace: clearledger
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ledger-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clearledger-notification
  namespace: clearledger
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: notification-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
