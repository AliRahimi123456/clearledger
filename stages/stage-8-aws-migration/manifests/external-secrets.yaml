# Stage 8 — ESO pulls AWS Secrets Manager → Kubernetes Secrets (replaces Vault sidecar)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-secret
  namespace: clearledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-service-secret
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: clearledger/auth-service
        property: database_url
    - secretKey: jwt_secret
      remoteRef:
        key: clearledger/auth-service
        property: jwt_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-service-secret
  namespace: clearledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ledger-service-secret
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: clearledger/ledger-service
        property: database_url
