# Stage 8 — CSI: mount clearledger/ledger-service from AWS Secrets Manager as files
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: clearledger-ledger-service-spc
  namespace: clearledger
spec:
  provider: aws
  parameters:
    region: eu-west-1
    objects: |
      - objectName: "clearledger/ledger-service"
        objectType: "secretsmanager"
        jmesPath:
          - path: database_url
            objectAlias: database_url
