# Experiment 1 — pod-delete against auth-service (2 replicas)
# ChaosEngine lives in litmus namespace (Kyverno blocks runners in clearledger).
# Targets app in clearledger via spec.appinfo.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: auth-service-pod-delete
  namespace: litmus
spec:
  appinfo:
    appns: clearledger
    applabel: app=auth-service
    appkind: deployment
  engineState: active
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: CHAOS_INTERVAL
              value: "10"
            - name: FORCE
              value: "false"
            - name: PODS_AFFECTED_PERC
              value: "50"
