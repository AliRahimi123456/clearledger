# INTRODUCED: Stage 6.5 — LitmusChaos RBAC
# PURPOSE: Service account for ChaosEngine runner pods (lives in litmus namespace).
# ChaosEngine resources also live in litmus — Kyverno in clearledger blocks
# non-compliant runner pods; see LAB-GUIDE §6.5.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litmus-admin
  namespace: litmus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litmus-admin-chaos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: litmus-admin
    namespace: litmus
