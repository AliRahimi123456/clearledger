# Stage 8 — verify Cosign signatures on Amazon ECR images (same key as homelab)
#
# SETUP: Replace the placeholder below with your actual cosign.pub content (same key as require-signed-images.yaml).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images-ecr
  annotations:
    policies.kyverno.io/title: Require Signed ECR Images
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >
      ECR variant of require-signed-images.yaml for Stage 8 AWS deployments.
spec:
  validationFailureAction: Audit
  # Audit until CI has COSIGN_PRIVATE_KEY + COSIGN_PASSWORD (ci-aws.yaml signs on publish).
  # Switch to Enforce after images in ECR are cosign-signed. Real key required either way
  # (placeholder text is misread as a file path by Kyverno).
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Ignore
  # failurePolicy: Ignore lets Kyverno pass the request when it cannot process
  # the verifyImages rule (e.g. image has no cosign signature yet).
  # Switch back to Fail once CI is signing images with COSIGN_PRIVATE_KEY.
  rules:
    - name: verify-ecr-cosign-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [clearledger]
      verifyImages:
        - imageReferences:
            - "*.dkr.ecr.*.amazonaws.com/clearledger/auth-service*"
            - "*.dkr.ecr.*.amazonaws.com/clearledger/ledger-service*"
            - "*.dkr.ecr.*.amazonaws.com/clearledger/notification-service*"
          mutateDigest: false
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |-
                      PASTE_YOUR_COSIGN_PUBLIC_KEY_HERE
