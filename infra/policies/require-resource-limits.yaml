# INTRODUCED: Stage 4 — Admission Control
# PURPOSE: Enforce resource requests and limits on all containers
# FRAMEWORK: CIS Kubernetes 5.2.4
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >
      All containers must declare resource requests and limits.
      Unbounded containers can starve other services in a fintech
      shared cluster — a stability and compliance risk.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-resources
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [clearledger]
      validate:
        message: "Resource requests and limits are required for all containers."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
