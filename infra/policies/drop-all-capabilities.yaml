# INTRODUCED: Stage 4 — Admission Control
# PURPOSE: Enforce principle of least privilege at the Linux kernel level
# FRAMEWORK: CIS Kubernetes 5.2.7
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Drop All Capabilities
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >
      Containers must drop ALL Linux capabilities. This is the principle
      of least privilege at the kernel level — essential for fintech workloads.
      Capabilities like NET_RAW, SYS_ADMIN, or CHOWN are attack vectors
      when a container is compromised.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-capabilities
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [clearledger]
      validate:
        message: "All containers must drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
