# INTRODUCED: Stage 2 — GitOps with ArgoCD
# PURPOSE: Declare ClearLedger as an ArgoCD Application — the GitOps contract
# FRAMEWORK: GitOps / DORA metrics — deployment frequency and change failure rate
#
# Apply this once. ArgoCD handles all future deployments automatically.
#   kubectl apply -f infra/argocd/clearledger-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clearledger
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Osomudeya/clearledger-infra.git
    targetRevision: main
    path: manifests
    directory:
      recurse: true   # required — deployments live in manifests/*/
  destination:
    server: https://kubernetes.default.svc
    namespace: clearledger
  # Homelab: until clearledger-infra.git has startupProbe + 384Mi on auth-service,
  # kubectl apply from this repo is not reverted every sync (remove after infra git is updated).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: auth-service
      namespace: clearledger
      jsonPointers:
        - /spec/template/spec/containers/0/resources
        - /spec/template/spec/containers/0/startupProbe
        - /spec/template/spec/containers/0/livenessProbe
        - /spec/template/spec/containers/0/readinessProbe
        - /spec/revisionHistoryLimit
  syncPolicy:
    automated:
      prune: true      # remove resources deleted from Git
      selfHeal: true   # revert any manual kubectl changes — the GitOps contract
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
